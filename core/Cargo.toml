[package]
name = "nextcloud-windows-aio-core"
version = "0.1.0"
edition = "2021"
description = "High-performance process supervisor and Windows drive permission manager for Nextcloud All-In-One"
license = "AGPL-3.0-or-later"

[[bin]]
name = "nextcloud-aio"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["full"] }
colored = "2.1"
anyhow = "1.0"
ctrlc = "3.4"
