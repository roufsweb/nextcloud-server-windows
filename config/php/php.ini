[PHP]
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; High-Performance & Hardened php.ini for Nextcloud Server Windows (All-In-One) ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

;; Engine & Memory
engine = On
short_open_tag = Off
precision = 14
output_buffering = Off
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1
zend.enable_gc = On
zend.exception_ignore_args = On
zend.multibyte = Off

;; Resource Limits
max_execution_time = 3600
max_input_time = 3600
max_input_vars = 10000
memory_limit = 1024M

;; =========================================================================
;; Defensive Security Hardening & Vulnerability Mitigation
;; =========================================================================
; Hide PHP version banner from HTTP headers (Prevents version fingerprinting)
expose_php = Off

; Prevent Remote File Inclusion (RFI) attacks
allow_url_include = Off
allow_url_fopen = On

; FastCGI Arbitrary Script Execution Defense (Prevents executing non-PHP uploads)
cgi.fix_pathinfo = 0
cgi.force_redirect = 1

; Dynamic module loading prevention
enable_dl = Off

; Error Reporting & Information Disclosure Prevention
display_errors = Off
display_startup_errors = Off
log_errors = On
log_errors_max_len = 1024
ignore_repeated_errors = Off
ignore_repeated_source = Off
report_memleaks = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
error_log = "logs/php_error.log"
mail.add_x_header = Off

;; Session Security & Anti-Hijacking
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 86400
session.sid_length = 48
session.sid_bits_per_character = 6

;; Data Handling & Large Uploads (Direct Drive & Large Sync Support)
post_max_size = 16G
upload_max_filesize = 16G
max_file_uploads = 100
default_mimetype = "text/html"
default_charset = "UTF-8"

;; Paths and Directories
extension_dir = "ext"
upload_tmp_dir = "tmp"
sys_temp_dir = "tmp"

;; File Uploads
file_uploads = On

;; Windows Specific & Sockets
default_socket_timeout = 3600

;; Dynamic Extensions for Nextcloud & 3rd-Party Apps
extension=bz2
extension=curl
extension=fileinfo
extension=gd
extension=gettext
extension=gmp
extension=intl
extension=mbstring
extension=exif
extension=mysqli
extension=openssl
extension=pdo_mysql
extension=pdo_pgsql
extension=pdo_sqlite
extension=sodium
extension=sqlite3
extension=zip
extension=php_redis.dll
extension=php_apcu.dll

;; Module Settings - APCu (Local Cache)
[apcu]
apc.enabled = 1
apc.enable_cli = 1
apc.shm_size = 128M
apc.ttl = 7200
apc.gc_ttl = 3600

;; Module Settings - Zend OPcache (JIT & In-Memory Precompilation)
[opcache]
zend_extension=opcache
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.max_wasted_percentage = 10
opcache.revalidate_freq = 60
opcache.save_comments = 1
opcache.validate_timestamps = 1
opcache.huge_code_pages = 0

; OPcache JIT (Just-In-Time Compiler for PHP 8.3)
opcache.jit = 1255
opcache.jit_buffer_size = 128M

;; Module Settings - Redis (Session & Distributed Cache)
[redis]
redis.session.locking_enabled = 1
redis.session.lock_wait_time = 20000
redis.session.lock_retries = 300
