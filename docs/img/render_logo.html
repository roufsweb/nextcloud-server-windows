<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 512px;
      height: 512px;
      background: radial-gradient(circle at center, #161b22, #090d13);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .logo-container {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .glow-ring {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.25) 0%, rgba(0, 130, 201, 0.05) 60%, transparent 80%);
      filter: blur(20px);
    }
    .cloud-card {
      position: relative;
      width: 260px;
      height: 260px;
      background: linear-gradient(135deg, rgba(22, 27, 34, 0.85), rgba(30, 36, 46, 0.6));
      border: 2px solid rgba(0, 210, 255, 0.4);
      border-radius: 54px;
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 50px rgba(0, 130, 201, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }
    .cloud-svg {
      width: 140px;
      height: 140px;
      filter: drop-shadow(0 8px 16px rgba(0, 210, 255, 0.5));
    }
    .badge-win {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 54px;
      height: 54px;
      background: linear-gradient(135deg, #0082c9, #00d2ff);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 210, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .badge-win svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="glow-ring"></div>
    <div class="cloud-card">
      <svg class="cloud-svg" viewBox="0 0 24 24" fill="none">
        <defs>
          <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00d2ff" />
            <stop offset="100%" stop-color="#0082c9" />
          </linearGradient>
        </defs>
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z" fill="url(#cloudGrad)"/>
      </svg>
      <div class="badge-win">
        <svg viewBox="0 0 88 88">
          <path d="M0,12.5 L35.8,7.6 L35.8,41.9 L0,41.9 Z M0,46.1 L35.8,46.1 L35.8,80.4 L0,75.5 Z M40.2,6.9 L87.5,0 L87.5,41.9 L40.2,41.9 Z M40.2,46.1 L87.5,46.1 L87.5,88 L40.2,81.1 Z"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
